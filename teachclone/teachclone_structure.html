<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeachClone — Project Structure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080C14;--s1:#0E1523;--s2:#131E30;--s3:#1A2640;
  --border:#1E2D45;--border2:#2A3F5F;
  --text:#E2EAF4;--muted:#5B7A9D;--muted2:#7A98BA;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
  /* file type colors */
  --c-ts:#4FC3F7;--c-py:#FFD54F;--c-css:#CE93D8;
  --c-md:#80CBC4;--c-json:#A5D6A7;--c-yml:#FFCC02;
  --c-dir:#7986CB;--c-docker:#29B6F6;--c-sh:#66BB6A;
  --c-env:#FF8A65;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.hdr{background:var(--s1);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.logo-box{width:28px;height:28px;background:linear-gradient(135deg,#6366F1,#06B6D4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.hdr-controls{display:flex;align-items:center;gap:8px}
.ctrl-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.ctrl-btn:hover{border-color:var(--border2);color:var(--text)}
.search-box{background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:5px 12px;border-radius:6px;font-family:var(--sans);outline:none;width:180px}
.search-box:focus{border-color:#6366F1}
.search-box::placeholder{color:var(--muted)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* TREE PANEL */
.tree-panel{width:420px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.tree-panel::-webkit-scrollbar{width:4px}
.tree-panel::-webkit-scrollbar-track{background:transparent}
.tree-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* INFO PANEL */
.info-panel{flex:1;overflow-y:auto;padding:28px 32px}
.info-panel::-webkit-scrollbar{width:4px}
.info-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* TREE NODES */
.tree-root{font-family:var(--mono);font-size:12.5px}
.node{user-select:none}
.node-row{display:flex;align-items:center;gap:0;padding:2px 0 2px 0;cursor:pointer;border-radius:4px;transition:background .1s;position:relative}
.node-row:hover{background:rgba(99,102,241,.07)}
.node-row.selected{background:rgba(99,102,241,.14)!important}
.node-indent{display:flex;align-items:stretch;flex-shrink:0}
.indent-line{width:20px;border-left:1px solid var(--border);margin:0;flex-shrink:0}
.indent-space{width:20px;flex-shrink:0}
.toggle-icon{width:16px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;flex-shrink:0;transition:transform .15s}
.toggle-icon.open{transform:rotate(90deg)}
.toggle-icon.leaf{opacity:0;pointer-events:none}
.node-icon{width:16px;height:18px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.node-name{padding:0 4px;color:var(--text);white-space:nowrap}
.node-name.dir{color:var(--c-dir);font-weight:500}
.node-name.dim{color:var(--muted)}
.node-tag{font-size:9px;padding:1px 5px;border-radius:3px;margin-left:6px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.children{overflow:hidden}
.children.collapsed{display:none}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s1)}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);color:var(--muted2)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* INFO PANEL CONTENT */
.info-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:12px;min-height:300px}
.info-placeholder-icon{font-size:40px;opacity:.4}
.info-placeholder p{font-size:13px;line-height:1.6;max-width:240px}

.info-card{display:none}
.info-card.show{display:block}
.info-path{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.info-path span{color:var(--muted2)}
.info-path .sep{color:var(--muted)}
.info-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.info-icon-big{font-size:28px;line-height:1}
.info-title{font-size:20px;font-weight:600;margin-bottom:4px;font-family:var(--mono)}
.info-type-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.info-desc{font-size:14px;color:var(--muted2);line-height:1.75;margin-bottom:20px}
.info-section{margin-bottom:20px}
.info-section-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.info-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.info-list li{font-size:13px;color:var(--muted2);display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.info-list li::before{content:"›";color:#6366F1;flex-shrink:0;margin-top:1px}
.info-list li strong{color:var(--text);font-weight:500}
.info-code{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:12px;color:#94A3B8;line-height:1.7;white-space:pre;overflow-x:auto;margin-top:8px}
.info-code::-webkit-scrollbar{height:3px}
.info-code::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.info-chips{display:flex;flex-wrap:wrap;gap:6px}
.info-chip{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:4px;border:1px solid var(--border2);color:var(--muted2)}

/* highlight matched search */
.node-name.match{background:rgba(245,158,11,.15);border-radius:2px}

@media(max-width:700px){
  .tree-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:45vh}
  .layout{flex-direction:column}
  .info-panel{padding:16px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <div class="logo-box">🧠</div>
    TeachClone <span style="color:var(--muted);font-weight:400;font-size:13px;margin-left:6px">/ project structure</span>
  </div>
  <div class="hdr-controls">
    <input class="search-box" placeholder="Search files…" oninput="search(this.value)" id="searchInput">
    <button class="ctrl-btn" onclick="expandAll()">Expand all</button>
    <button class="ctrl-btn" onclick="collapseAll()">Collapse all</button>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-dir)"></div>Directory</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-ts)"></div>.ts / .tsx</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-py)"></div>.py</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-yml)"></div>.yml / .yaml</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-json)"></div>.json</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-md)"></div>.md</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-docker)"></div>Docker</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-env)"></div>.env</div>
</div>

<div class="layout">
<div class="tree-panel" id="tree"></div>
<div class="info-panel" id="infoPanel">
  <div class="info-placeholder">
    <div class="info-placeholder-icon">📂</div>
    <p>Click any file or folder to see what it does and what goes inside it</p>
  </div>
  <div class="info-card" id="infoCard"></div>
</div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const INFO = {

└── docs/           ← architecture docs`},

  'apps': {icon:'🗂️',type:'DIR',color:'#7986CB',desc:'Contains the two runnable applications: the Next.js frontend and the FastAPI backend.',keys:[]},
  'apps/web': {icon:'🌐',type:'NEXT.JS APP',color:'#4FC3F7',desc:'Next.js 14 frontend with App Router. TypeScript, Tailwind CSS, shadcn/ui. Deployed to Vercel.',

  'apps/web/app/(protected)': {icon:'🔒',type:'ROUTE GROUP',color:'#7986CB',desc:'All authenticated routes. Every page here is protected by Clerk middleware — unauthenticated users are redirected to /sign-in.',

  'apps/web/app/(protected)/admin/[org_slug]': {icon:'🏢',type:'ADMIN PAGES',color:'#4FC3F7',desc:'Institution admin panel. Only accessible by org admins. Manage members, profiles, analytics, and security settings.',

  'apps/api/app/services/prompt_builder.py': {icon:'🧠',type:'PY FILE',color:'#FFD54F',desc:'The most critical file in the codebase. Dynamically builds the LLM system prompt by combining teacher style, student profile, and retrieved content.',
    keys:['build_system_prompt(teacher_profile, student_session, context_chunks) → str','LEVEL_INSTRUCTIONS dict: per-level vocabulary guidance (k5 → professional)','STYLE_INSTRUCTIONS dict: per-learning-style explanation ordering','format_context_chunks(): formats RAG results as numbered knowledge entries','Re-evaluated on every chat turn — never cached'],
    code:`def build_system_prompt(teacher, session, chunks) -> str:
  style = teacher.style_profile
  student = session.student_profile
  level = session.current_effective_level
  return f"""You are an AI version of {teacher.name}...
  TEACHER STYLE: {style.tone_type}, {style.explanation_pattern}
  STUDENT LEVEL: {level} — {LEVEL_INSTRUCTIONS[level]}
  KNOWLEDGE BASE:
  {format_context_chunks(chunks)}
  RULES: ..."""`},

  'apps/api/app/services/style_extractor.py': {icon:'🎭',type:'PY FILE',color:'#FFD54F',desc:'Extracts a structured StyleProfile from transcript chunks. Combines statistical NLP analysis with LLM classification.',
    keys:['Flesch-Kincaid grade level via textstat library','Analogy density: regex search for "like","imagine","think of","similar to"','Signature phrase extraction: Counter on 3-5 word n-grams','LLM analysis via Claude: tone_type, explanation_pattern, pacing','Averaging: if teacher has multiple videos, profiles are averaged'],
    code:`class StyleExtractor:
  async def extract(self, chunks) -> StyleProfile:
    text = join(chunks)
    stats = {
      vocabulary_score: flesch_kincaid(text),    # textstat
      avg_sentence_length: nltk.sent_tokenize(),
      analogy_density: regex_count(ANALOGY_WORDS),
      signature_phrases: top_ngrams(text, n=3-5)
    }
    llm = await self._llm_analyze(chunks[:15])   # Claude
    return StyleProfile(**stats, **llm)`},

  'apps/api/app/services/vector_store.py': {icon:'🔍',type:'PY FILE',color:'#FFD54F',desc:'Qdrant vector database client. Manages the collection, upserts embeddings, and performs hybrid search.',
    keys:['Collection: "teachclone_chunks" with 3072-dim dense + sparse vectors','Hybrid search: dense (semantic) + BM25 sparse, merged with RRF','Namespace isolation: filter by teacher_profile_id on every search','Metadata stored in payload: text, timestamps, media_source_id, content_type'],
    code:`async def hybrid_search(query_dense, query_sparse, teacher_profile_id, top_k=8):
  dense_results = await client.search(
    collection_name=COLLECTION,
    query_vector=query_dense,
    query_filter=Filter(must=[FieldCondition(key="teacher_profile_id"...)])
  )
  sparse_results = await client.search(using="sparse", ...)
  return rrf_merge(dense_results, sparse_results, k=60)[:top_k]`},

      {name:'architecture.md', type:'md'},{name:'api-reference.md', type:'md'},
      {name:'deployment.md', type:'md'}]},

// ─── FILE TYPE CONFIG ─────────────────────────────────────────────────────────
const FT = {
  dir:    {icon:'📁', color:'var(--c-dir)'},
  ts:     {icon:'📄', color:'var(--c-ts)'},
  py:     {icon:'🐍', color:'var(--c-py)'},
  css:    {icon:'🎨', color:'var(--c-css)'},
  md:     {icon:'📝', color:'var(--c-md)'},
  json:   {icon:'{}',color:'var(--c-json)'},
  yml:    {icon:'⚙️', color:'var(--c-yml)'},
  docker: {icon:'🐳', color:'var(--c-docker)'},
  sh:     {icon:'💻', color:'var(--c-sh)'},
  env:    {icon:'🔑', color:'var(--c-env)'},
};

// ─── RENDER TREE ─────────────────────────────────────────────────────────────
let selectedKey = null;

function getKey(node, parentKey) {
  return node.key || (parentKey ? parentKey + '/' + node.name : node.name);
}

function renderNode(node, depth, parentKey, isLast) {
  const key = getKey(node, parentKey);
  const ft = FT[node.type] || FT.ts;
  const isDir = node.type === 'dir';
  const hasChildren = isDir && node.children && node.children.length > 0;

  const div = document.createElement('div');
  div.className = 'node';
  div.dataset.key = key;
  div.dataset.name = node.name.toLowerCase();

  const row = document.createElement('div');
  row.className = 'node-row';
  row.style.paddingLeft = '8px';

  // Indent
  const indent = document.createElement('div');
  indent.className = 'node-indent';
  for (let i = 0; i < depth; i++) {
    const line = document.createElement('div');
    line.className = i < depth - 1 ? 'indent-line' : 'indent-space';
    indent.appendChild(line);
  }
  row.appendChild(indent);

  // Toggle
  const toggle = document.createElement('div');
  toggle.className = 'toggle-icon' + (hasChildren ? (node.open ? ' open' : '') : ' leaf');
  toggle.textContent = '›';
  row.appendChild(toggle);

  // Icon
  const icon = document.createElement('div');
  icon.className = 'node-icon';
  icon.textContent = ft.icon;
  row.appendChild(icon);

  // Name
  const name = document.createElement('div');
  name.className = 'node-name' + (isDir ? ' dir' : '');
  name.style.color = isDir ? 'var(--c-dir)' : ft.color;
  name.textContent = node.name;
  row.appendChild(name);

  // Tag
  if (node.tag) {
    const tag = document.createElement('span');
    tag.className = 'node-tag';
    tag.style.background = (node.tagColor || '#6366F1') + '22';
    tag.style.color = node.tagColor || '#818CF8';
    tag.textContent = node.tag;
    row.appendChild(tag);
  }

  div.appendChild(row);

  // Children
  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'children' + (node.open ? '' : ' collapsed');
    node.children.forEach((child, i) => {
      children.appendChild(renderNode(child, depth + 1, key, i === node.children.length - 1));
    });
    div.appendChild(children);

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const collapsed = children.classList.toggle('collapsed');
      toggle.classList.toggle('open', !collapsed);
      node.open = !collapsed;
    });
    row.addEventListener('click', () => {
      const collapsed = children.classList.toggle('collapsed');
      toggle.classList.toggle('open', !collapsed);
      node.open = !collapsed;
      selectNode(key, row);
    });
  } else {
    row.addEventListener('click', () => selectNode(key, row));
  }

  return div;
}

function selectNode(key, row) {
  document.querySelectorAll('.node-row.selected').forEach(r => r.classList.remove('selected'));
  row.classList.add('selected');
  selectedKey = key;
  showInfo(key);
}

function showInfo(key) {
  const info = INFO[key];
  const card = document.getElementById('infoCard');
  const placeholder = document.querySelector('.info-placeholder');

  if (!info) {
    // Show generic file info
    placeholder.style.display = 'flex';
    card.classList.remove('show');
    return;
  }

  placeholder.style.display = 'none';
  card.classList.add('show');

  // Build path breadcrumbs
  const parts = key.split('/');
  const pathHtml = parts.map((p,i) => `<span>${p}</span>${i < parts.length-1 ? '<span class="sep">/</span>' : ''}`).join('');

  let html = `<div class="info-path">${pathHtml}</div>
<div class="info-header">
  <div class="info-icon-big">${info.icon}</div>
  <div>
    <div class="info-title">${parts[parts.length-1]}</div>
    <span class="info-type-badge" style="background:${(info.color||'#6366F1')}22;color:${info.color||'#818CF8'}">${info.type}</span>
  </div>
</div>
<div class="info-desc">${info.desc}</div>`;

  if (info.keys && info.keys.length) {
    html += `<div class="info-section"><div class="info-section-title">Key points</div>
<ul class="info-list">${info.keys.map(k=>`<li>${k}</li>`).join('')}</ul></div>`;
  }

  if (info.chips && info.chips.length) {
    html += `<div class="info-section"><div class="info-section-title">Tech used</div>
<div class="info-chips">${info.chips.map(c=>`<span class="info-chip">${c}</span>`).join('')}</div></div>`;
  }

  if (info.code) {
    html += `<div class="info-section"><div class="info-section-title">Structure / example</div>
<div class="info-code">${info.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`;
  }

  card.innerHTML = html;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const treeEl = document.getElementById('tree');
const root = document.createElement('div');
root.className = 'tree-root';
root.appendChild(renderNode(TREE, 0, '', true));
treeEl.appendChild(root);

// ─── EXPAND / COLLAPSE ALL ───────────────────────────────────────────────────
function expandAll() {
  document.querySelectorAll('.children').forEach(el => { el.classList.remove('collapsed'); });
  document.querySelectorAll('.toggle-icon:not(.leaf)').forEach(el => { el.classList.add('open'); });
}
function collapseAll() {
  document.querySelectorAll('.children').forEach(el => { el.classList.add('collapsed'); });
  document.querySelectorAll('.toggle-icon').forEach(el => { el.classList.remove('open'); });
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
let searchTimeout;
function search(q) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const query = q.toLowerCase().trim();
    document.querySelectorAll('.node-name').forEach(el => el.classList.remove('match'));

    if (!query) return;

    document.querySelectorAll('.node').forEach(node => {
      const name = (node.dataset.name || '').toLowerCase();
      if (name.includes(query)) {
        const nameEl = node.querySelector('.node-row > .node-name');
        if (nameEl) nameEl.classList.add('match');
        // Expand parents
        let p = node.parentElement;
        while (p) {
          if (p.classList.contains('children')) {
            p.classList.remove('collapsed');
            const toggle = p.previousElementSibling?.querySelector('.toggle-icon');
            if (toggle) toggle.classList.add('open');
          }
          p = p.parentElement;
        }
      }
    });
  }, 200);
}

// Show root info on load
setTimeout(() => showInfo('teachclone'), 100);
</script>
