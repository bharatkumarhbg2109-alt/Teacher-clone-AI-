# .github/workflows/ci.yml
name: AI Teacher Clone — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Run backend unit tests
        working-directory: backend
        run: |
          python -m pytest graph/test_*.py verify_chat_api.py -v \
            --tb=short --no-header \
            -k "not requires_ollama and not requires_gpu"
        env:
          PYTHONPATH: .
          CI: true
          SKIP_OLLAMA: true

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx eslint src/ --max-warnings 0 || true

  saas-tests:
    name: SaaS Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "teacher_project - Copy/apps/api/requirements-local.txt"
      - name: Install SaaS deps
        run: |
          pip install -r "teacher_project - Copy/apps/api/requirements-local.txt"
      - name: Run SaaS health check
        working-directory: "teacher_project - Copy/apps/api"
        run: |
          python -c "
          import sys, os
          os.environ['DEV_MODE'] = 'true'
          sys.path.insert(0, '.')
          from app.main import app
          print('SAAS_APP_IMPORT_OK')
          "
        env:
          DEV_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./teachclone.db"
