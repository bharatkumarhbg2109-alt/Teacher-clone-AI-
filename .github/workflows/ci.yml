# .github/workflows/ci.yml
name: TeachClone — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: teachclone/apps/api/requirements.txt

      - name: Install dependencies
        working-directory: teachclone/apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        working-directory: teachclone/apps/api
        run: |
          python -m pytest tests -x -q
        env:
          CI: "true"
          DEV_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

  web-typecheck:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: teachclone/apps/web/package-lock.json

      - name: Install dependencies
        working-directory: teachclone/apps/web
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: teachclone/apps/web
        run: npx tsc --noEmit

      - name: Production build (next build)
        working-directory: teachclone/apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  boot-smoke-test:
    name: API Boot & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: teachclone/apps/api/requirements.txt

      - name: Install dependencies
        working-directory: teachclone/apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API boot, route count (>=40), and /health (200)
        working-directory: teachclone/apps/api
        run: |
          python -c "
          import os, sys
          os.environ['DEV_MODE'] = 'true'
          os.environ['DATABASE_URL'] = 'sqlite+aiosqlite:///:memory:'
          from app.main import create_app
          app = create_app()
          routes = {r.path for r in app.routes}
          print(f'Total routes registered: {len(routes)}')
          assert len(routes) >= 40, f'Expected >= 40 routes, got {len(routes)}'
          from fastapi.testclient import TestClient
          client = TestClient(app)
          resp = client.get('/health')
          print(f'/health status: {resp.status_code}, data: {resp.json()}')
          assert resp.status_code == 200, f'Expected 200 from /health, got {resp.status_code}'
          assert resp.json().get('status') == 'ok', 'Status was not ok'
          print('BOOT_SMOKE_TEST_PASSED')
          "
        env:
          CI: "true"
          DEV_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
