name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./teachclone/apps/api
          file: ./teachclone/apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teachclone-api:latest
            ghcr.io/${{ github.repository_owner }}/teachclone-api:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./teachclone/apps/web
          file: ./teachclone/apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teachclone-web:latest
            ghcr.io/${{ github.repository_owner }}/teachclone-web:${{ github.sha }}
