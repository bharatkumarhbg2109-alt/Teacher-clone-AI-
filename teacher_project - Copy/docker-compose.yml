# TeachClone — Docker Compose with healthchecks
# Usage:
#   docker compose up              # Start all services
#   docker compose up -d           # Start in background
#   docker compose up --build      # Rebuild images and start
#   docker compose ps              # Check service health
#   docker compose down            # Stop all services

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: teachclone-api
    ports:
      - "8000:8000"
    environment:
      - DEV_MODE=true
      - ENV=local
      - DATABASE_URL=postgresql+asyncpg://teachclone:teachclone@postgres:5432/teachclone
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - APP_URL=http://localhost:3000
      - API_URL=http://localhost:8000
      - INLINE_TASKS=true
      - STORAGE_BACKEND=local
      - VECTOR_BACKEND=qdrant
      - EMBEDDING_PROVIDER=hash
      - EMBEDDING_DIM=512
      - EMAIL_BACKEND=log
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - api-storage:/app/storage_data
      - api-db:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - teachclone

  # ── Next.js Frontend ────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: teachclone-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - teachclone

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: teachclone-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: teachclone
      POSTGRES_USER: teachclone
      POSTGRES_PASSWORD: teachclone
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachclone -d teachclone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - teachclone

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: teachclone-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - teachclone

  # ── Qdrant (Vector Store) ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: teachclone-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - teachclone

  # ── Ollama (Local LLM) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: teachclone-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - teachclone

  # ── Ollama Model Puller (init container) ────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: teachclone-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: >
      sh -c "
        echo 'Pulling llama3.1 model...'
        ollama pull llama3.1
        echo 'Pulling mistral model...'
        ollama pull mistral
        echo 'Models ready.'
      "
    restart: "no"
    networks:
      - teachclone

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  api-storage:
  api-db:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-data:

# ── Network ───────────────────────────────────────────────────────────────
networks:
  teachclone:
    driver: bridge
